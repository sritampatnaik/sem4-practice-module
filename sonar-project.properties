sonar.projectKey=ais-sem4-practice-module_mets-scan
sonar.organization=ais-sem4-practice-module

sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Eval datasets intentionally repeat the same case/scaffold structure.
sonar.cpd.exclusions=src/evals/catalog/**

# POC coverage focuses on tutor behaviour rather than optional semantic retrieval
# and presentation-only animations. These files remain in Sonar issue analysis.
sonar.coverage.exclusions=src/lib/embeddings.ts,src/components/primitives/GlideMenu.tsx,src/components/primitives/StreamingText.tsx,src/components/primitives/ThinkingState.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
