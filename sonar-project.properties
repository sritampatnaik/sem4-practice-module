sonar.projectKey=ais-sem4-practice-module_mets-scan
sonar.organization=ais-sem4-practice-module

sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Eval datasets intentionally repeat the same case/scaffold structure.
sonar.cpd.exclusions=src/evals/catalog/**

# POC coverage focuses on tutor behaviour rather than generated types, static
# prompt/data definitions, thin Next route wrappers, and browser-only visuals.
# These files remain in Sonar issue analysis.
sonar.coverage.exclusions=src/lib/database.types.ts,src/lib/embeddings.ts,src/agents/**/prompts.ts,src/app/**/page.tsx,src/app/**/layout.tsx,src/agents/physics/physics-diagram-widget.tsx,src/components/primitives/GlideMenu.tsx,src/components/primitives/PromptBar.tsx,src/components/primitives/StreamingText.tsx,src/components/primitives/ThinkingState.tsx,src/components/primitives/ToolChips.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
